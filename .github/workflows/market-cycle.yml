name: Market cycle (every 30 min, FX hours)

# Runs itself: every 30 minutes (:02 and :32) across the forex week, Sun ~21:00 UTC -> Fri ~22:00 UTC.
# Each run: Headway login/history → Dukascopy fill for missing history (500-bar minimum) →
# 51-strategy scan → demo order placement (signal_id dedup) → position management → local audit.
# GitHub scheduled runs are best-effort and can start late or occasionally be skipped.

on:
  schedule:
    - cron: "2,32 21-23 * * 0"
    - cron: "2,32 * * * 1-4"
    - cron: "2,32 0-21 * * 5"
  workflow_dispatch:
    inputs:
      force_scan:
        description: "Scan outside London/NY sessions (testing)"
        required: false
        default: "false"
      confirm_fresh_state:
        description: "First migration only: confirm no open bot positions and accept a new local ledger"
        type: choice
        required: true
        default: "NO"
        options:
          - "NO"
          - "YES_I_HAVE_RECONCILED_OPEN_POSITIONS_AND_ACCEPT_NEW_LEDGER"

concurrency:
  group: market-cycle
  cancel-in-progress: false       # a late run queues behind the current one; the single terminal session is never doubled

permissions:
  contents: read

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # This deployment is deliberately demo-only. Live-account execution is not enabled here.
      ACCOUNT_MODE: demo
      BRIDGE_ACCOUNT_MODE: demo
      BRIDGE_EXPECTED_SERVER: Headway-Demo
      # Permanent strategy execution on every scheduled market cycle (demo account only).
      ALLOW_ORDERS: "yes"
      BRIDGE_REAL_EXECUTION: "true"
      MAX_ORDERS_PER_CYCLE: "1"
      DUKASCOPY_MIN_M30_BARS: "500"
      DUKASCOPY_LOOKBACK_DAYS: "60"
      KB_FORCE_SCAN: ${{ github.event.inputs.force_scan || 'false' }}
      WEB_TERMINAL_URL: ${{ secrets.WEB_TERMINAL_URL }}
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4

      # GitHub-hosted runners are ephemeral. Restore the local event ledger and
      # candle database so signal deduplication and open-position state survive.
      - name: Restore persistent trading state
        uses: actions/cache/restore@v4
        with:
          path: |
            audit/events.jsonl
            data/candles_m30.csv
          key: market-cycle-state-${{ github.run_id }}
          restore-keys: |
            market-cycle-state-

      # Supabase history is deliberately not imported. Do not silently start a blank
      # deduplication/position ledger if the Actions cache is missing or evicted.
      # The one-time confirmation is required only for the first local-state bootstrap.
      - name: Require restored state or explicit first-migration confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [ -s audit/events.jsonl ]; then
            echo "Local audit ledger restored (size=$(wc -c < audit/events.jsonl) bytes)."
          elif [ "${{ inputs.confirm_fresh_state }}" = "YES_I_HAVE_RECONCILED_OPEN_POSITIONS_AND_ACCEPT_NEW_LEDGER" ]; then
            mkdir -p audit
            : > audit/events.jsonl
            echo "::warning::Starting a new local audit ledger. Previous Supabase signal history is not imported."
          else
            echo "::error::No local audit ledger was restored. Refusing to trade with missing deduplication/position state."
            echo "For the first migration only, manually dispatch this workflow after checking the Headway demo account has no unmanaged bot positions, then select the explicit fresh-state confirmation."
            exit 1
          fi

      - name: Required secrets present
        run: |
          test "$ACCOUNT_MODE" = "demo" || { echo "::error::This workflow is locked to demo execution"; exit 1; }
          test -n "$MT5_LOGIN" && test -n "$MT5_PASSWORD" || { echo "::error::Headway demo MT5_LOGIN / MT5_PASSWORD secrets are missing"; exit 1; }
          # WEB_TERMINAL_URL is optional in demo mode; the automation has the demo URL default.

      # Node + browser first: the sooner the terminal session starts, the more of each half-hour is observed.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: headway/headway-mt5-web-automation/package-lock.json
      - name: Install terminal automation
        working-directory: headway/headway-mt5-web-automation
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tse-reference/tse-mt5-integration/requirements.txt
      - run: pip install -r tse-reference/tse-mt5-integration/requirements.txt pytest

      - name: Unit tests (fail fast, demo contract)
        run: |
          (cd bridge && BRIDGE_ACCOUNT_MODE=demo BRIDGE_EXPECTED_SERVER=Headway-Demo python -m pytest -q)
          (cd headway/headway-mt5-web-automation && npm test)

      - name: Cycle (bootstrap history, scan, execute demo strategy orders, manage positions, verify)
        run: bash scripts/run_cycle.sh

      - name: Remove an uninitialized empty audit ledger
        if: always()
        shell: bash
        run: |
          if [ -f audit/events.jsonl ] && [ ! -s audit/events.jsonl ]; then
            rm -f audit/events.jsonl
            echo "::warning::Empty audit ledger removed; it will not be cached as initialized state."
          fi

      - name: Save persistent trading state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            audit/events.jsonl
            data/candles_m30.csv
          key: market-cycle-state-${{ github.run_id }}

      - name: Upload diagnostics (JSON/logs only, no screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cycle-${{ github.run_id }}
          path: |
            audit/events.jsonl
            audit/summary.json
            work/history_quality.json
            work/dukascopy_bootstrap.json
            headway/headway-mt5-web-automation/artifacts/*.json
            headway/headway-mt5-web-automation/artifacts/*.log
          retention-days: 14
          if-no-files-found: ignore
