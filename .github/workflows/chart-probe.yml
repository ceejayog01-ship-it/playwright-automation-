name: Headway chart probe (read-only audit)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  chart-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ACCOUNT_MODE: demo
      WEB_TERMINAL_URL: https://hw.online/webterminal/mt5-demo/
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      EXPECTED_SERVER_LABEL: Headway-Demo
      HEADLESS: 'true'
      DEFAULT_TIMEOUT: '60000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$MT5_LOGIN" || { echo 'MT5_LOGIN secret missing'; exit 1; }
          test -n "$MT5_PASSWORD" || { echo 'MT5_PASSWORD secret missing'; exit 1; }
          [[ "$MT5_LOGIN" =~ ^[0-9]{5,}$ ]] || { echo 'MT5_LOGIN must be numeric'; exit 1; }
      - name: Compile TypeScript
        run: npm run build
      - name: Run automated tests
        run: npm test
      - name: Run read-only chart probe
        run: npm run chartprobe
      - name: Upload audit evidence (also on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headway-chart-probe-audit-${{ github.run_id }}
          path: artifacts/chart-probe/
          if-no-files-found: warn
          retention-days: 14
