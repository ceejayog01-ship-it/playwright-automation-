name: Extract and Install Trading Project

on:
  workflow_dispatch:
    inputs:
      zip_path:
        description: "ZIP filename (leave blank for automatic detection)"
        required: false
        default: ""

  push:
    paths:
      - "tse-headway-trading-integrated.zip"
      - "tse-headway-trading-integrated.zip.zip"
      - "tse-headway-trading-integrated-*.zip"

permissions:
  contents: read

concurrency:
  group: trading-project-extraction
  cancel-in-progress: false

jobs:
  extract:
    name: Extract and Install Project
    runs-on: ubuntu-latest

    steps:

      # 1. Verify authentication secret
      - name: Verify repository token
        env:
          REPO_TOKEN: ${{ secrets.REPO_WORKFLOW_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$REPO_TOKEN" ]]; then
            echo "::error::REPO_WORKFLOW_TOKEN is missing."
            exit 1
          fi

          echo "Repository token detected."

      # 2. Checkout using the fine-grained token
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_WORKFLOW_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      # 3. Locate ZIP
      - name: Locate project ZIP
        id: locate
        shell: bash
        env:
          REQUESTED_ZIP: ${{ inputs.zip_path }}
        run: |
          set -euo pipefail

          ZIP=""

          if [[ -n "$REQUESTED_ZIP" ]]; then
            ZIP="$REQUESTED_ZIP"
          else
            for candidate in \
              "tse-headway-trading-integrated.zip" \
              "tse-headway-trading-integrated.zip.zip"; do

              if [[ -f "$candidate" ]]; then
                ZIP="$candidate"
                break
              fi
            done

            if [[ -z "$ZIP" ]]; then
              ZIP=$(find . -maxdepth 1 -type f \
                -name 'tse-headway-trading-integrated-*.zip' \
                -print -quit)
            fi
          fi

          if [[ -z "$ZIP" || ! -f "$ZIP" ]]; then
            echo "::error::Project ZIP not found."

            echo "Repository files:"
            ls -lah

            exit 1
          fi

          echo "Found ZIP: $ZIP"

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      # 4. Validate archive
      - name: Validate ZIP integrity
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail

          unzip -tq "$ZIP"

          echo "ZIP integrity verified."

      # 5. Extract archive
      - name: Extract project
        env:
          ZIP: ${{ steps.locate.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf /tmp/project-extract

          mkdir -p /tmp/project-extract

          unzip -oq "$ZIP" -d /tmp/project-extract

          if [[ ! -d "/tmp/project-extract/integrated" ]]; then
            echo "::error::Expected integrated/ directory missing."

            find /tmp/project-extract -maxdepth 3 -print

            exit 1
          fi

          echo "Extraction successful."

          echo "Extracted file count:"
          find /tmp/project-extract/integrated \
            -type f | wc -l

      # 6. Install files into repository root
      - name: Install project into repository
        run: |
          set -euo pipefail

          # Preserve this installer workflow.
          cp .github/workflows/main.yml \
            /tmp/extract-installer-main.yml

          # Install extracted project.
          cp -a /tmp/project-extract/integrated/. .

          # Restore installer so the archive cannot replace it.
          cp /tmp/extract-installer-main.yml \
            .github/workflows/main.yml

          echo "Project installed into repository root."

      # 7. Verify installation
      - name: Verify installed files
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "README.md"
            "AUDIT.md"
            "IMPLEMENTATION-NOTES.md"
            "RUNBOOK.md"
            "STATUS.md"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              exit 1
            fi

            echo "PASS: $file"
          done

          if [[ ! -d "bridge" ]]; then
            echo "::error::bridge directory missing."
            exit 1
          fi

          if [[ ! -d ".github/workflows" ]]; then
            echo "::error::Workflow directory missing."
            exit 1
          fi

          echo "Project structure verification passed."

          echo "Installed files:"
          find . -maxdepth 3 \
            -not -path './.git*' \
            -type f | sort | head -150

      # 8. Commit and push using PAT
      - name: Commit and push project
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Install extracted trading project"

            git push origin \
              "HEAD:${GITHUB_REF_NAME}"
          fi

          echo "Commit and push operation completed."

      # 9. Verify pushed commit
      - name: Verify GitHub repository
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "$GITHUB_REF_NAME"

          LOCAL_COMMIT=$(git rev-parse HEAD)

          REMOTE_COMMIT=$(git rev-parse \
            "origin/$GITHUB_REF_NAME")

          echo "Local commit: $LOCAL_COMMIT"
          echo "Remote commit: $REMOTE_COMMIT"

          if [[ "$LOCAL_COMMIT" != "$REMOTE_COMMIT" ]]; then
            echo "::error::Remote commit verification failed."
            exit 1
          fi

          echo "PASS: GitHub remote contains the installed commit."

          echo "Final repository structure:"
          ls -lah

      # 10. Upload extracted project
      - name: Upload extracted project artifact
        uses: actions/upload-artifact@v4
        with:
          name: extracted-headway-trading-project
          path: /tmp/project-extract/integrated/
          if-no-files-found: error
          retention-days: 7
