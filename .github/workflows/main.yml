name: Extract and Install Project

on:
  workflow_dispatch:

  push:
    paths:
      - "tse-headway-trading-integrated.zip"
      - "tse-headway-trading-integrated.zip.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate ZIP file
        id: locate
        run: |
          if [ -f "tse-headway-trading-integrated.zip" ]; then
            ZIP="tse-headway-trading-integrated.zip"
          elif [ -f "tse-headway-trading-integrated.zip.zip" ]; then
            ZIP="tse-headway-trading-integrated.zip.zip"
          else
            echo "::error::ZIP file not found"
            ls -lah
            exit 1
          fi

          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Validate ZIP
        run: |
          unzip -tq "${{ steps.locate.outputs.zip }}"

      - name: Extract project
        run: |
          mkdir -p /tmp/project-extract

          unzip -oq "${{ steps.locate.outputs.zip }}" \
            -d /tmp/project-extract

          if [ ! -d "/tmp/project-extract/integrated" ]; then
            echo "::error::integrated directory missing"
            find /tmp/project-extract -maxdepth 3
            exit 1
          fi

      - name: Install project files into repository root
        run: |
          cp -a /tmp/project-extract/integrated/. .

          echo "Installed project structure:"
          ls -la

      - name: Verify installation
        run: |
          test -f README.md || {
            echo "::error::README.md missing from repository root"
            exit 1
          }

          echo "Project files:"
          find . -maxdepth 3 \
            -not -path './.git*' \
            -not -path './.github*' \
            -type f | head -100

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Install extracted trading project"
            git push origin HEAD
          fi

      - name: Verify committed files
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Latest commit:"
          git log -1 --oneline

          echo "Project root:"
          ls -la
