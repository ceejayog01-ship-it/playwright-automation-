name: Headway demo trade execution test

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: headway-demo-trade-test
  cancel-in-progress: false

jobs:
  demo-trade-test:
    name: Verify demo terminal and execute one tiny demo test order
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: headway/headway-mt5-web-automation
    env:
      ACCOUNT_MODE: demo
      WEB_TERMINAL_URL: https://hw.online/webterminal/mt5-demo/
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      EXPECTED_SERVER_LABEL: Headway-Demo
      EXPECTED_TERMINAL_HOST: demo-mt5.hw-terminal.com
      HEADLESS: 'true'
      DEFAULT_TIMEOUT: '60000'
      ORDER_SYMBOLS: EURUSD
      ALLOW_ORDERS: 'yes'
      ALLOW_ORDER_WITHOUT_SL: 'yes'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify demo credentials are present
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MT5_LOGIN" || { echo "::error::MT5_LOGIN secret is missing"; exit 1; }
          test -n "$MT5_PASSWORD" || { echo "::error::MT5_PASSWORD secret is missing"; exit 1; }
          [[ "$MT5_LOGIN" =~ ^[0-9]{5,}$ ]] || { echo "::error::MT5_LOGIN must be numeric"; exit 1; }
          echo "Demo credentials are present; values are not printed."

      - name: Install locked dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Compile TypeScript
        run: npm run build

      - name: Run automated tests
        run: npm test

      - name: Verify demo account identity, EURUSD M30 chart and native candles
        run: npm run chartprobe

      - name: Execute one 0.01-lot demo connectivity order and request immediate close
        run: npm run strategy-order -- --execute --close --symbol EURUSD --lots 0.01 --signal-id demo-connectivity-test

      - name: Upload demo trade evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headway-demo-trade-evidence-${{ github.run_id }}
          path: headway/headway-mt5-web-automation/artifacts/
          if-no-files-found: warn
          retention-days: 14
