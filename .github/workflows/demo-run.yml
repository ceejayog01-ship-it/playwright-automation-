name: Headway MT5 Demo Automation

on:
  workflow_dispatch:

  # Optional scheduled execution.
  # Uncomment after successful manual testing.
  #
  # schedule:
  #   - cron: '0 */2 * * *'

permissions:
  contents: read

concurrency:
  group: headway-mt5-demo
  cancel-in-progress: false

jobs:
  run-automation:

    runs-on: ubuntu-latest

    timeout-minutes: 25

    steps:

      # --------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------
      # 2. SETUP NODE.JS
      # --------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # --------------------------------
      # 3. VERIFY PROJECT FILES
      # --------------------------------

      - name: Verify project files
        run: |

          echo "Checking project structure..."

          test -f package.json || {
            echo "ERROR: package.json missing"
            exit 1
          }

          test -f tsconfig.json || {
            echo "ERROR: tsconfig.json missing"
            exit 1
          }

          test -f src/index.ts || {
            echo "ERROR: src/index.ts missing"
            exit 1
          }

          test -f config/selectors.ts || {
            echo "ERROR: config/selectors.ts missing"
            exit 1
          }

          echo "Project files verified."

      # --------------------------------
      # 4. INSTALL NPM DEPENDENCIES
      # --------------------------------

      - name: Install npm dependencies
        run: |
          npm install --no-audit --no-fund

      # --------------------------------
      # 5. INSTALL PLAYWRIGHT CHROMIUM
      # --------------------------------

      - name: Install Playwright Chromium
        run: |
          npx playwright install --with-deps chromium

      # --------------------------------
      # 6. PREPARE ARTIFACT DIRECTORY
      # --------------------------------

      - name: Prepare artifacts directory
        run: |

          mkdir -p artifacts

          echo "Workflow started: $(date -u)" \
            > artifacts/workflow.log

      # --------------------------------
      # 7. VALIDATE GITHUB SECRETS
      # --------------------------------

      - name: Validate required secrets
        env:

          WEB_TERMINAL_URL: ${{ secrets.WEB_TERMINAL_URL }}

          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}

          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}

        run: |

          if [ -z "$WEB_TERMINAL_URL" ]; then
            echo "ERROR: WEB_TERMINAL_URL is missing"
            exit 1
          fi

          if [ -z "$MT5_LOGIN" ]; then
            echo "ERROR: MT5_LOGIN is missing"
            exit 1
          fi

          if [ -z "$MT5_PASSWORD" ]; then
            echo "ERROR: MT5_PASSWORD is missing"
            exit 1
          fi

          echo "Required secrets are configured."

      # --------------------------------
      # 8. RUN HEADWAY DEMO LOGIN
      # --------------------------------

      - name: Run Headway demo login
        env:

          WEB_TERMINAL_URL: ${{ secrets.WEB_TERMINAL_URL }}

          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}

          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}

          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}

          HEADLESS: 'true'

          SLOW_MO: '60'

          DEFAULT_TIMEOUT: '60000'

        shell: bash

        run: |

          set +e

          echo "Starting Headway demo login..."

          npx ts-node src/index.ts --mode=login \
            2>&1 | tee artifacts/automation.log

          EXIT_CODE=${PIPESTATUS[0]}

          echo "Automation exit code: $EXIT_CODE"

          echo "AUTOMATION_EXIT_CODE=$EXIT_CODE" \
            >> "$GITHUB_ENV"

          exit "$EXIT_CODE"

      # --------------------------------
      # 9. SAVE EXECUTION INFORMATION
      # --------------------------------

      - name: Save execution information
        if: always()

        run: |

          mkdir -p artifacts

          echo "Workflow completed: $(date -u)" \
            >> artifacts/workflow.log

          echo "Run ID: $GITHUB_RUN_ID" \
            >> artifacts/workflow.log

          echo "Commit: $GITHUB_SHA" \
            >> artifacts/workflow.log

          echo "Automation exit code: ${AUTOMATION_EXIT_CODE:-not started}" \
            >> artifacts/workflow.log

      # --------------------------------
      # 10. UPLOAD LOGS AND SCREENSHOTS
      # --------------------------------

      - name: Upload automation artifacts
        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: headway-automation-${{ github.run_id }}

          path: artifacts/

          if-no-files-found: warn

          retention-days: 14
