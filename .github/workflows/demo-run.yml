name: Headway MT5 Demo Automation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headway-mt5-demo-login
  cancel-in-progress: false

jobs:
  run-automation:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify project files
        run: |
          test -f package.json
          test -f tsconfig.json
          test -f src/index.ts
          test -f src/login.ts
          test -f src/utils.ts
          test -f config/selectors.ts

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Compile TypeScript
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare artifacts
        if: always()
        run: mkdir -p artifacts

      - name: Validate required secrets
        env:
          WEB_TERMINAL_URL: ${{ secrets.WEB_TERMINAL_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
        run: |
          test -n "$WEB_TERMINAL_URL" || { echo 'WEB_TERMINAL_URL missing'; exit 1; }
          test -n "$MT5_LOGIN" || { echo 'MT5_LOGIN missing'; exit 1; }
          test -n "$MT5_PASSWORD" || { echo 'MT5_PASSWORD missing'; exit 1; }
          echo 'Required secrets are configured.'

      - name: Run Headway demo login diagnostic
        env:
          WEB_TERMINAL_URL: ${{ secrets.WEB_TERMINAL_URL }}
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          HEADLESS: 'true'
          SLOW_MO: '60'
          DEFAULT_TIMEOUT: '60000'
        shell: bash
        run: |
          set +e
          npx ts-node src/index.ts --mode=login 2>&1 | tee artifacts/automation.log
          code=${PIPESTATUS[0]}
          echo "AUTOMATION_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit "$code"

      - name: Save run metadata
        if: always()
        run: |
          mkdir -p artifacts
          {
            echo "Completed: $(date -u +%FT%TZ)"
            echo "Run ID: $GITHUB_RUN_ID"
            echo "Commit: $GITHUB_SHA"
            echo "Exit code: ${AUTOMATION_EXIT_CODE:-not-started}"
          } >> artifacts/workflow.log

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headway-login-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
