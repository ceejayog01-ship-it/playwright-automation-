name: Install Repository ZIP

on:
workflow_dispatch:

permissions:
contents: write

jobs:
install:
runs-on: ubuntu-latest

steps:
  # 1. Checkout repository using your existing token
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      token: ${{ secrets.REPO_WORKFLOW_TOKEN }}
      persist-credentials: true

  # 2. Verify the ZIP exists
  - name: Verify ZIP file
    run: |
      ZIP_FILE="yfinance-headway-full-repo.zip"

      if [ ! -f "$ZIP_FILE" ]; then
        echo "ERROR: $ZIP_FILE not found in repository root."
        echo "Upload the ZIP to the root of your repository."
        exit 1
      fi

      echo "ZIP file found."

  # 3. Extract ZIP into temporary directory
  - name: Extract repository ZIP
    run: |
      mkdir -p /tmp/repo-extract

      unzip -q yfinance-headway-full-repo.zip \
        -d /tmp/repo-extract

      echo "ZIP extracted successfully."

  # 4. Install ZIP contents directly into repository root
  - name: Install repository files
    run: |
      SOURCE_DIR="/tmp/repo-extract/yfinance-headway-repo"

      if [ ! -d "$SOURCE_DIR" ]; then
        echo "ERROR: Expected yfinance-headway-repo folder not found."
        echo "ZIP contents:"
        find /tmp/repo-extract -maxdepth 3 -type f
        exit 1
      fi

      cp -a "$SOURCE_DIR/." .

      echo "Repository files installed into root."

  # 5. Remove uploaded ZIP
  - name: Remove installation ZIP
    run: |
      rm -f yfinance-headway-full-repo.zip

      echo "Installation ZIP removed."

  # 6. Commit and push installed files
  - name: Commit and push changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add -A

      if git diff --cached --quiet; then
        echo "No changes to commit."
        exit 0
      fi

      git commit -m "Install complete repository from ZIP"

      git push
