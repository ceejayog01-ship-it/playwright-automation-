name: Install Repository ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_WORKFLOW_TOKEN || github.token }}
          persist-credentials: true

      - name: Verify ZIP file
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="yfinance-headway-full-repo.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found in repository root."
            exit 1
          fi

          echo "ZIP file found."

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/repo-extract

          unzip -q yfinance-headway-full-repo.zip \
            -d /tmp/repo-extract

          echo "ZIP extracted successfully."

      - name: Install files into repository root
        shell: bash
        run: |
          set -euo pipefail

          SOURCE_DIR="/tmp/repo-extract/yfinance-headway-repo"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "::error::Expected yfinance-headway-repo directory not found."

            echo "Extracted contents:"
            find /tmp/repo-extract -maxdepth 3 -type f

            exit 1
          fi

          cp -a "$SOURCE_DIR/." .

          echo "Repository files installed."

      - name: Remove ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f yfinance-headway-full-repo.zip

          echo "ZIP removed."

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install complete repository from ZIP"

          git push
