name: Install Repository ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - name: Verify ZIP exists
        run: |
          if [ ! -f "yfinance-headway-full-repo.zip" ]; then
            echo "ERROR: ZIP file not found in repository root."
            exit 1
          fi

      - name: Extract ZIP into repository root
        run: |
          mkdir -p /tmp/repo-extract

          unzip -q yfinance-headway-full-repo.zip \
            -d /tmp/repo-extract

          SOURCE_DIR="/tmp/repo-extract/yfinance-headway-repo"

          if [ ! -d "$SOURCE_DIR" ]; then
            echo "ERROR: Expected ZIP folder not found."
            exit 1
          fi

          cp -a "$SOURCE_DIR/." .

      - name: Remove installation ZIP
        run: |
          rm -f yfinance-headway-full-repo.zip

      - name: Commit and push installed repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Install complete repository from ZIP"

          git push
