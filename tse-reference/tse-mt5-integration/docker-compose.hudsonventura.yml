# Hudsonventura MT5 terminal + TSE signal drop-file path
#
# Flow:
#   Python TSE → state/signals_canonical.jsonl (audit)
#             → mql5/Files/tse_signals.csv  and  .data/MQL5/Files/tse_signals.csv
#   EA TSE_SignalExecutor.mq5 (compiled, attached to chart) polls the CSV and trades.
#
# First run: open http://localhost:6901/vnc.html?password=change_me
#            install/login to broker, compile/attach the EA.

services:
  mt5:
    image: hudsonventura/mt5:2.3
    ports:
      - "5901:5901"   # VNC
      - "6901:6901"   # noVNC browser
    environment:
      - VNC_PW=change_me
      - SCREEN_RESOLUTION=1280x800
    volumes:
      # Experts / Include for compilation & runtime
      - ./mql5/Experts:/home/headless/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Experts
      - ./mql5/Include:/home/headless/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Include:ro
      # Signal drop-file lands here (EA reads MQL5/Files/tse_signals.csv)
      - ./.data/MQL5/Files:/home/headless/.wine/drive_c/Program Files/MetaTrader 5/MQL5/Files
    restart: unless-stopped
    mem_limit: 1024m

  # One-shot MQL5 compiler (optional)
  mt5-compiler:
    image: hudsonventura/mt5:2.3
    profiles: ["compile"]
    volumes:
      - ./mql5/Experts:/home/headless/.wine/drive_c/MQL5/Experts
      - ./mql5/Include:/home/headless/.wine/drive_c/MQL5/Include:ro
    command: /build.sh
    restart: "no"
